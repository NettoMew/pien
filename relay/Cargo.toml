[package]
name = "relay"
version = "0.1.0"
edition = "2024"
publish = false
description = "A private Ethernet segment per WebSocket, gatewayed onto the internet, for pien's guest"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Four addresses for the gateway: 10.0.2.2, 10.0.2.3, its IPv6 one and fe80::2.
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "auto-icmp-echo-reply", "iface-max-addr-count-4"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "tls-ring", "webpki-roots", "system-config"] }
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
p256 = { version = "0.14", default-features = false, features = ["ecdh"] }
getrandom = "0.3"
socket2 = { version = "0.6", features = ["all"] }
tokio-socks = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
bytes = "1"

# The network's errors about our datagrams (reports.rs): Linux's IP_RECVERR
# and IPV6_RECVERR.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The tests' guest makes its IPv6 address as Linux does, from the gateway's
# advertisements (SLAAC).
[dev-dependencies]
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "proto-ipv6", "proto-ipv6-slaac", "socket-tcp", "socket-udp"] }
