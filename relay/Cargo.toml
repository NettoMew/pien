[package]
name = "relay"
version = "0.1.0"
edition = "2024"
publish = false
description = "A private Ethernet segment per WebSocket, gatewayed onto the internet, for the guest@home VM"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "auto-icmp-echo-reply"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "tls-ring", "system-config"] }
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
pbkdf2 = "0.13"
p256 = { version = "0.14", default-features = false, features = ["ecdh"] }
getrandom = "0.3"
socket2 = { version = "0.6", features = ["all"] }
tokio-socks = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
bytes = "1"

[dev-dependencies]
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }
