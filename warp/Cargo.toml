[package]
name = "warp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Cloudflare WARP (MASQUE over HTTP/2) as a sans-I/O state machine, for the guest@home VM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# no_std: its std feature wants a system clock, which wasm32-unknown-unknown lacks.
rustls = { version = "0.23.45", default-features = false, features = ["custom-provider"] }
chacha20poly1305 = { version = "0.11", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh"] }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }

# Outside the browser (tests, examples/edge.rs) randomness comes from the OS.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
