# Builds the whole site from scratch — kernel, the tools Alpine lacks, image,
# snapshot, page — checks it with pretend devices (USB, serial, Bluetooth LE),
# a pretend folder and save dialog, passkeys in software and a real browser,
# and hands the result over as the "site" artifact, ready for any static host
# (public/_headers sets the cache rules). The workbench
# and the WARP client are sealed, and built no more (docs/workbench.md,
# docs/warp.md).

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Downloads (Alpine packages, BIOS), the kernel and the tools are keyed by content.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: cache-${{ hashFiles('image/kernel/**', 'image/tools/**', 'image/image.config.ts') }}
          restore-keys: cache-

      # The network relay (relay/, Rust): a smoltcp guest end to end through it.
      # Its pings go out through unprivileged ping sockets, which containers
      # allow every group and this runner allows none.
      - run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: cargo test --manifest-path relay/Cargo.toml

      # press (press/): logging in, with a passkey in software and a pretend GitHub.
      - run: npm ci --prefix press
      - run: npm test --prefix press

      - run: npm run build:kernel
      - run: npm run build:tools
      - run: npm run build:vm # image, snapshot, and what Python's tools read as they start
      - run: npm run check:usb
      - run: npm run check:serial
      - run: npm run check:ble
      - run: npm run check:files
      - run: npm run lint
      - run: npm run build # type-checks first
      - run: npm run check:login # passkeys and relays, in Chrome, against the build
      - run: npm run check:writing # posts, pictures and moments from inside the machine

      - name: Smoke test
        run: |
          npx vite preview --port 4173 --strictPort &
          until curl -sf http://localhost:4173/ > /dev/null; do sleep 0.5; done
          npm run smoke -- http://localhost:4173/

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: .cache/smoke
