# Builds the whole site from scratch — kernel, Edit, image, snapshot, page —
# checks it with a pretend phone, a pretend serial port and a real browser, and
# hands the result over as the "site" artifact, ready for any static host
# (public/_headers sets the cache rules). The workbench and the WARP client are
# sealed, and built no more (docs/workbench.md, docs/warp.md).

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Downloads (Alpine packages, BIOS), the kernel and Edit are keyed by content.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: cache-${{ hashFiles('image/kernel/**', 'image/edit/**', 'image/image.config.ts') }}
          restore-keys: cache-

      # The network relay (relay/, Rust): a smoltcp guest end to end through it.
      - run: cargo test --manifest-path relay/Cargo.toml

      - run: npm run build:kernel
      - run: npm run build:edit
      - run: npm run build:vm
      - run: npm run check:usb
      - run: npm run check:serial
      - run: npm run lint
      - run: npm run build # type-checks first

      - name: Smoke test
        run: |
          npx vite preview --port 4173 --strictPort &
          until curl -sf http://localhost:4173/ > /dev/null; do sleep 0.5; done
          npm run smoke -- http://localhost:4173/

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: .cache/smoke
