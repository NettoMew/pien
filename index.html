<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="description" content="A real Linux, running in your browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate" type="application/rss+xml" title="guest@home" href="/feed.xml" />
    <title>guest@home</title>
  </head>
  <body data-state="loading">
    <main id="terminal" aria-label="Terminal"></main>
    <nav id="keys" aria-label="Keys">
      <button type="button" data-key="tab">Tab</button>
      <button type="button" data-key="up" aria-label="Previous command">↑</button>
      <button type="button" data-key="interrupt" aria-label="Interrupt">^C</button>
      <span class="gap"></span>
      <button type="button" data-run="help">help</button>
      <button type="button" data-run="blog">blog</button>
      <button type="button" data-run="ls -l blog">ls</button>
      <button type="button" data-run="clear">clear</button>
    </nav>
    <footer id="status">
      <span class="indicator"><span class="dot"></span><span id="state">Loading</span></span>
      <span id="activity"></span>
      <span id="net" data-net="off"></span>
      <span id="machine"></span>
    </footer>
    <noscript>
      <p>This homepage is a Linux machine running in your browser, and needs JavaScript. The posts can be read as they are:</p>
      <!-- posts -->
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
