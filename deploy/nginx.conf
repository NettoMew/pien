# The site's nginx: it serves dist/, and with press and the relay beside it,
# what press renders and the way to both (docs/deploy.md). Same rules as
# public/_headers: hashed files are cached forever, index.html is always
# checked, and text-like assets travel compressed.
#
# Where things are is in the first lines of the server block, the same with
# Docker or without: everything runs in the host's own network, behind
# Caddy, on 127.0.0.1; with Docker, the nginx:alpine image takes this file
# as conf.d/default.conf, and the site and press's pages are mounted where
# a host of its own keeps them.

server {
    listen 127.0.0.1:8080;

    # The built site; what press renders as the writing changes; the relay
    # and press. Through variables, as nginx resolves them per request: it
    # starts even while one of the two is away.
    set $site /srv/pien/site;
    set $renders /srv/pien/press/public;
    set $relay http://127.0.0.1:8095;
    set $press http://127.0.0.1:8096;

    root $site;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json application/wasm
               image/svg+xml application/rss+xml text/xml;

    location /vm/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Where press finds the posts' stylesheet; nobody else's business.
    location /.vite/ {
        return 404;
    }

    # The writing, as press renders it whenever it changes (press/src/render.ts,
    # docs/writing.md): its files and pictures named by their content keep
    # forever; the index the page compares with is always checked.
    location /content/ {
        root $renders;
        add_header Cache-Control "public, max-age=31536000, immutable";

        location = /content/index.json {
            root $renders;
            add_header Cache-Control "no-cache";
        }
    }

    # Its web pages: press's, newer than the build's, which stand in when
    # press has rendered nothing yet.
    location /blog/ {
        root $renders/pages;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ @built;
    }

    location /moments/ {
        root $renders/pages;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ @built;
    }

    location = /feed.xml {
        root $renders/pages;
        types { application/rss+xml xml; }
        add_header Cache-Control "no-cache";
        try_files $uri @built;
    }

    location @built {
        types { application/rss+xml xml; text/html html; }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # `net on`: the WebSocket to the relay (relay/, docs/relay.md). The
    # frames inside are sealed; nothing here is worth logging.
    location = /relay {
        proxy_pass $relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h; # the relay pings every 25 s
        proxy_send_timeout 1h;
        proxy_buffering off;
        access_log off;
    }

    # Logging in and writing (press/, docs/login.md, docs/writing.md).
    # Pictures come up through it, so bodies may be large; press holds each
    # route to its own limit. Nothing it answers is for a cache.
    location /api/ {
        proxy_pass $press;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 40m;
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
