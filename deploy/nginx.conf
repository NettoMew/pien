# Serving dist/ from nginx (e.g. the nginx:alpine image, as conf.d/default.conf).
# Same rules as public/_headers: hashed files are cached forever, index.html
# is always checked, and text-like assets travel compressed. With press
# beside it, the writing comes from what press renders, mounted at /srv/press.

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json application/wasm
               image/svg+xml application/rss+xml text/xml;

    location /vm/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Where press finds the posts' stylesheet; nobody else's business.
    location /.vite/ {
        return 404;
    }

    # The writing, as press renders it whenever it changes (press/src/render.ts,
    # docs/writing.md): its files and pictures named by their content keep
    # forever; the index the page compares with is always checked.
    location /content/ {
        root /srv/press;
        add_header Cache-Control "public, max-age=31536000, immutable";

        location = /content/index.json {
            root /srv/press;
            add_header Cache-Control "no-cache";
        }
    }

    # Its web pages: press's, newer than the build's, which stand in when
    # press has rendered nothing yet.
    location /blog/ {
        root /srv/press/pages;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ @built;
    }

    location /moments/ {
        root /srv/press/pages;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ @built;
    }

    location = /feed.xml {
        root /srv/press/pages;
        types { application/rss+xml xml; }
        add_header Cache-Control "no-cache";
        try_files $uri @built;
    }

    location @built {
        types { application/rss+xml xml; text/html html; }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # `net on`: the WebSocket to the relay (relay/, docs/relay.md), a container
    # named homepage-relay on the same Docker network. Looked up per request,
    # so nginx starts even while the relay is away. The frames inside are
    # sealed; nothing here is worth logging.
    location = /relay {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $relay http://homepage-relay:8095;
        proxy_pass $relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h; # the relay pings every 25 s
        proxy_send_timeout 1h;
        proxy_buffering off;
        access_log off;
    }

    # Logging in and writing (press/, docs/login.md, docs/writing.md): a
    # container named homepage-press on the same Docker network, looked up per
    # request like the relay. Pictures come up through it, so bodies may be
    # large; press holds each route to its own limit. Nothing it answers is
    # for a cache.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $press http://homepage-press:8096;
        proxy_pass $press;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 40m;
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
